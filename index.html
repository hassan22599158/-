<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>لوحة الشطرنج</title>
  <link rel="stylesheet" href="assets/chessboard.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 20px;
      background-color: #f0f0f0;
    }
    #board {
      max-width: 600px;
      margin: auto;
    }
  </style>
</head>
<body>
  <h1>موقع الشطرنج التفاعلي</h1>
  <div id="board"></div>

  <div id="info-panel" style="max-width: 600px; margin: 20px auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h3 dir="rtl">سجل اللعب والشرح</h3>
    <p id="status" dir="rtl" style="font-size: 1.1em; color: #333;">أنتظر البداية...</p>
    <div id="explanation" dir="rtl" style="margin-top: 10px; padding: 10px; background: #eef; border-right: 4px solid #4a90e2; text-align: right;">
       شرح النقلات سيظهر هنا.
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
